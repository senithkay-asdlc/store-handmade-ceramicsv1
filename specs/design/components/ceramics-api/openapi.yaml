openapi: 3.0.3
info:
  title: Ceramics API
  version: 0.1.0
  description: Catalog, cart, checkout, and order management for the handmade ceramics store.
servers:
  - url: /
tags:
  - name: Products
  - name: Categories
  - name: Cart
  - name: Orders

paths:
  /categories:
    get:
      operationId: listCategories
      summary: List product categories
      tags: [Categories]
      responses:
        '200':
          description: category list
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }

  /products:
    get:
      operationId: listProducts
      summary: List/search/filter products
      tags: [Products]
      parameters:
        - name: category
          in: query
          schema: { type: string }
          description: filter by category id
        - name: search
          in: query
          schema: { type: string }
          description: full-text search on name/description
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: product list
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
    post:
      operationId: createProduct
      summary: Create a product (store owner only)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: not the store owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getProduct
      summary: Get product details
      tags: [Products]
      responses:
        '200':
          description: product details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateProduct
      summary: Update a product, including stock quantity (store owner only)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: product updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: not the store owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteProduct
      summary: Remove a product (store owner only)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: product removed
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: not the store owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /carts:
    post:
      operationId: createCart
      summary: Create a new cart (guest or signed-in shopper)
      tags: [Cart]
      responses:
        '201':
          description: cart created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /carts/{cartId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
    get:
      operationId: getCart
      summary: Get a cart and its items
      tags: [Cart]
      responses:
        '200':
          description: cart details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: cart not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /carts/{cartId}/items:
    parameters:
      - $ref: '#/components/parameters/CartId'
    post:
      operationId: addCartItem
      summary: Add a product to the cart
      tags: [Cart]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemInput' }
      responses:
        '201':
          description: item added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: invalid input, or insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: cart or product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /carts/{cartId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
      - name: itemId
        in: path
        required: true
        schema: { type: string }
        description: cart item id
    patch:
      operationId: updateCartItem
      summary: Change a cart item's quantity
      tags: [Cart]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemInput' }
      responses:
        '200':
          description: item updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: invalid input, or insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: cart item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: removeCartItem
      summary: Remove an item from the cart
      tags: [Cart]
      responses:
        '204':
          description: item removed
        '404':
          description: cart item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders:
    get:
      operationId: listOrders
      summary: List orders (store owner sees all; signed-in shopper sees own)
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string }
          description: filter by fulfillment status
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: order list
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createOrder
      summary: Check out a cart into an order (guest or signed-in shopper)
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: order created and charged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: invalid input, out-of-stock item, or payment failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      summary: Get order details
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: order details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    patch:
      operationId: updateOrderStatus
      summary: Update an order's fulfillment status (store owner only)
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, processing, shipped, delivered] }
      responses:
        '200':
          description: status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: invalid status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: not the store owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
      description: product id
    CartId:
      name: cartId
      in: path
      required: true
      schema: { type: string }
      description: cart id
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
      description: order id
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Product:
      type: object
      required: [id, name, price, stockQuantity, categoryId]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number, format: double }
        stockQuantity: { type: integer }
        categoryId: { type: string }
        imageUrl: { type: string }
    ProductInput:
      type: object
      required: [name, price, stockQuantity, categoryId]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number, format: double }
        stockQuantity: { type: integer }
        categoryId: { type: string }
        imageUrl: { type: string }
    CartItem:
      type: object
      required: [id, productId, quantity]
      properties:
        id: { type: string }
        productId: { type: string }
        quantity: { type: integer }
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer }
    Cart:
      type: object
      required: [id, items]
      properties:
        id: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
    OrderItem:
      type: object
      required: [id, productId, quantity, priceAtPurchase]
      properties:
        id: { type: string }
        productId: { type: string }
        quantity: { type: integer }
        priceAtPurchase: { type: number, format: double }
    OrderInput:
      type: object
      required: [cartId, shippingAddress, paymentToken]
      properties:
        cartId: { type: string }
        shippingAddress: { type: string }
        paymentToken: { type: string, description: tokenized payment method from the payment provider }
    Order:
      type: object
      required: [id, status, shippingAddress, total, items, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, processing, shipped, delivered] }
        shippingAddress: { type: string }
        total: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
